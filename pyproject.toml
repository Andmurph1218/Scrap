[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wago-catalog-processor"
version = "0.1.0"
description = "Pipeline Wago → Nuvemshop / Bling / Mercado Livre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40.0",
  "pandas>=2.1.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1.0",
  "lxml>=4.9.0",
]

[project.scripts]
wago = "wago.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
